name: Process Medical Directory Excel

on:
  push:
    paths:
      - 'Globmed.xlsx'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Process Excel File
      run: python scripts/parse_excel.py

    - name: Commit & Push updated data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update data.json from Excel"
        git push
